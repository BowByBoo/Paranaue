<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paranaue — Teste</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background: radial-gradient(circle at top, #5b21b6, #111827 60%, #030712);
    }
    main {
      width: min(720px, calc(100% - 32px));
      padding: 56px 40px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      font-size: 13px;
    }
    h1 { margin: 22px 0 12px; font-size: clamp(42px, 8vw, 72px); }
    p { margin: 0 auto 28px; max-width: 520px; color: #d1d5db; font-size: 18px; line-height: 1.6; }
    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: #111827;
      background: #fff;
    }
    button:hover { transform: translateY(-1px); }
    #status { margin-top: 18px; min-height: 24px; color: #86efac; }
  </style>
</head>
<body>
  <main>
    <span class="badge">FUNCIONANDO</span>
    <h1>Paranaue</h1>
    <p>Este é um site de teste criado diretamente no repositório pelo ChatGPT.</p>
    <button onclick="document.querySelector('#status').textContent='JavaScript também está funcionando 🚀'">Testar interação</button>
    <div id="status"></div>
  </main>
</body>
</html>
